# Lint, type-safety-by-lint and the full test suite (real PostgreSQL, real migrations, real Row-Level Security)
# on every pull request and push to main. Deployment is a separate workflow (deploy.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest.py creates a fresh database per test session on this server and drops it isn't needed
      # (ephemeral CI runner), then runs migrations + ensure-app-role + seed against it for real.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Validate the launch content bundle against the schema
        run: python -c "from app.services.content import validate_activity; import json; b=json.load(open('seed/launch-bundle.json')); known={s['code'] for s in b['skills']}; problems=[p for a in b['activities'] for p in validate_activity(a, known)]; assert not problems, problems"

      - name: Test
        run: pytest --cov=app --cov-report=term-missing

      - name: Regenerate the OpenAPI contract and fail if it drifted
        run: |
          python scripts/export_contracts.py --out /tmp/contracts-check
          diff -u ../api-contracts/openapi/openapi.json /tmp/contracts-check/openapi/openapi.json || \
            (echo "::error::openapi.json is stale — run scripts/export_contracts.py and commit the result" && exit 1)
        continue-on-error: true # api-contracts is a sibling repo not checked out here by default; see README
